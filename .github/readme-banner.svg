<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Depfix</title>
  <desc id="desc">Multiple Python package versions running together without dependency conflicts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#101a38" />
      <stop offset="1" stop-color="#1a1237" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59f0a8" />
      <stop offset="0.5" stop-color="#63d5ff" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#63d5ff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#63d5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8da2c8" stroke-opacity="0.07" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)" />
  <rect width="1200" height="360" rx="24" fill="url(#grid)" />
  <circle cx="940" cy="175" r="320" fill="url(#glow)" />

  <g fill="none" stroke-linecap="round">
    <path d="M836 90L940 134L1038 90M940 134V235M836 270L940 235L1038 270" stroke="#63d5ff" stroke-opacity="0.48" stroke-width="3" />
    <path d="M836 90L836 270M1038 90V270" stroke="#a78bfa" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="8 10" />
  </g>

  <g filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g transform="translate(780 48)">
      <rect width="112" height="76" rx="14" fill="#0e1b2e" stroke="#59f0a8" stroke-width="2" />
      <text x="56" y="33" fill="#dfffee" font-size="17" font-weight="700">pkg</text>
      <text x="56" y="56" fill="#59f0a8" font-size="14">v1</text>
    </g>
    <g transform="translate(884 96)">
      <rect width="112" height="76" rx="14" fill="#0e1b2e" stroke="#63d5ff" stroke-width="2" />
      <text x="56" y="33" fill="#e6f8ff" font-size="17" font-weight="700">dep</text>
      <text x="56" y="56" fill="#63d5ff" font-size="14">for v1</text>
    </g>
    <g transform="translate(982 48)">
      <rect width="112" height="76" rx="14" fill="#17162d" stroke="#a78bfa" stroke-width="2" />
      <text x="56" y="33" fill="#f3edff" font-size="17" font-weight="700">pkg</text>
      <text x="56" y="56" fill="#bca8ff" font-size="14">v2</text>
    </g>
    <g transform="translate(780 232)">
      <rect width="112" height="76" rx="14" fill="#0e1b2e" stroke="#59f0a8" stroke-width="2" />
      <text x="56" y="33" fill="#dfffee" font-size="17" font-weight="700">child</text>
      <text x="56" y="56" fill="#59f0a8" font-size="14">v3</text>
    </g>
    <g transform="translate(884 197)">
      <rect width="112" height="76" rx="14" fill="#0e1b2e" stroke="#63d5ff" stroke-width="2" />
      <text x="56" y="33" fill="#e6f8ff" font-size="17" font-weight="700">package</text>
      <text x="56" y="56" fill="#63d5ff" font-size="14">cached</text>
    </g>
    <g transform="translate(982 232)">
      <rect width="112" height="76" rx="14" fill="#17162d" stroke="#a78bfa" stroke-width="2" />
      <text x="56" y="33" fill="#f3edff" font-size="17" font-weight="700">child</text>
      <text x="56" y="56" fill="#bca8ff" font-size="14">v4</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="78" y="158" fill="url(#accent)" font-size="92" font-weight="800" letter-spacing="-4">depfix</text>
    <text x="84" y="211" fill="#edf4ff" font-size="25" font-weight="600">INSTALL AT RUNTIME. IMPORT ANY VERSION.</text>
    <text x="84" y="253" fill="#a8b8d8" font-size="20">No dependency collisions. No environment juggling.</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.38" stroke-width="2" />
</svg>
