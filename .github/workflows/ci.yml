name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,release]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src/depfix

  tests-x64:
    name: tests (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  tests-arm64:
    name: tests (${{ matrix.runner }}, arm64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  uv-boundaries:
    name: uv ${{ matrix.uv }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        uv: [minimum, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - if: matrix.uv == 'minimum'
        run: python -m pip install "uv==0.11.0"
      - if: matrix.uv == 'latest'
        run: python -m pip install --upgrade uv
      - run: uv --version
      - run: python -m pytest -q tests/test_public_product.py tests/test_end_to_end.py
      - name: Live uv-backed import
        env:
          DEPFIX_CACHE_DIR: ${{ runner.temp }}/depfix-uv-boundary
        run: >-
          python -c "from depfix import import_module;
          assert import_module('idna==3.10').__depfix_version__ == '3.10'"
      - name: Live incompatible OpenAI imports
        if: matrix.uv == 'latest'
        env:
          DEPFIX_RUN_LIVE_TESTS: "1"
        run: python -m pytest -q -m live tests/test_end_to_end.py

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, tests-x64, tests-arm64, uv-boundaries]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,release]"
      - run: python scripts/release_check.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
