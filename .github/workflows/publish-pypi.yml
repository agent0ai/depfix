name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v-prefixed release tag to build
        required: true
        type: string
      confirmation:
        description: Type publish-depfix-production to enable the trusted-publishing job
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,release]"
      - name: Verify tag matches the package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python -c "import os; from depfix import __version__;
          assert os.environ['RELEASE_TAG'] == f'v{__version__}',
          f'tag {os.environ[\"RELEASE_TAG\"]!r} does not match v{__version__}'"
      - run: python scripts/release_check.py
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.confirmation == 'publish-depfix-production'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/depfix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
